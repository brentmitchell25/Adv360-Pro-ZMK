#
# Kconfig overrides for the Adv360 Pro left half
# (sunaku Glorious Engrammer v42-rc9 port)
#

# Increase combo limits for our 22 combos
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=8
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8

# Increase behavior queue for complex Unicode macros
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256
